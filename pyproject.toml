[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reconkit"
version = "0.1.0"
description = "Scope-safe recon CLI: crt.sh subdomains, DNS, HTTP probe and tech fingerprints into a clean report"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27"]
authors = [{name = "naelqdl"}]

[project.scripts]
reconkit = "reconkit.cli:main"

[tool.setuptools]
packages = ["reconkit"]
